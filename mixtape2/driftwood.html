<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DRIFTWOOD</title>
<meta name="description" content="DRIFTWOOD: an electric guitar for writing songs, with a pedalboard and an amp, by a sea at sunset. Play it with a MIDI keyboard or the computer keyboard.">
<meta name="theme-color" content="#17120F">
<!-- DRIFTWOOD on its own, for the web (tools\driftwood-web.ps1 puts it together in driftwood-web\): the guitar from Mixtape 2
     (Devices\driftwood.js, its PAD from Devices\halo.js) with no desk around it, scaled to fit the window. It plays from any MIDI keyboard
     or the computer keyboard (KEYS on its bar) into the computer's sound output. As horizon.html does, this page stands in for Mixtape 2:
     Mixtape 2's own sound engine (engine.js) and MIDI (midi.js), and here the few things a device asks of the desk; its settings and
     saved presets are kept in this browser. -->
<style>
html,body{margin:0;height:100%;overflow:hidden;font-family:Bahnschrift,"Segoe UI",Arial,sans-serif;color:#EADBC8;
  background:radial-gradient(ellipse at 50% 40%,#2A211B,#0E0B09 75%)}
#fit{position:fixed;left:50%;top:50%;width:760px;height:400px;transform-origin:0 0}
#dev{position:absolute;inset:0;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.7)}
#toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);padding:10px 18px;border-radius:12px;background:rgba(20,14,10,.8);border:1px solid rgba(255,255,255,.15);
  font-size:13px;letter-spacing:1px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:5}
#toast.on{opacity:1}
#help{position:fixed;left:0;right:0;bottom:8px;text-align:center;font-size:12px;letter-spacing:1px;color:#A8927B}
/* a browser starts sound only after a click */
#start{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:6;background:rgba(0,0,0,.45);cursor:pointer}
#start span{padding:16px 28px;border-radius:16px;background:rgba(20,14,10,.75);border:1px solid rgba(255,255,255,.2);font-size:16px;letter-spacing:4px}
</style>
</head>
<body>
<div id="fit"><div id="dev"></div></div>
<div id="help">MIDI keyboard: just play · no keyboard: press KEYS, then A W S E D F T G … (Z X octave, C V softer / louder) · turn knobs by dragging up and down or scrolling</div>
<div id="toast"></div><div id="start"><span>CLICK TO START DRIFTWOOD</span></div>
<script src="engine.js"></script>
<script src="midi.js"></script>
<script>
/* ---- what a device asks of Mixtape 2, here: files by their place in the Mixtape folder (over the internet beside this page, a folder's
   list from its files.json), settings kept in this browser, no desk and no cables ---- */
(()=>{const M2=window.M2,store={get(k){try{return JSON.parse(localStorage.getItem('driftwood.'+k)||'null');}catch(e){return null;}},set(k,v){try{localStorage.setItem('driftwood.'+k,JSON.stringify(v));}catch(e){}}};
M2.store=store;
M2.fileUrl=p=>new URL('../'+String(p||'').replace(/\\/g,'/').split('/').map(encodeURIComponent).join('/'),location.href).href;   /* this page is in mixtape2\ */
M2.settings=Object.assign({},store.get('prefs')||{});
M2.prefs={set(k,v){M2.settings[k]=v;store.set('prefs',M2.settings);}};
M2.desk=M2.desk||{get:()=>null,all:()=>[],distance:()=>0,changed(){}};
M2.patch=M2.patch||{at:()=>[]};
if(!window.mixtapeFiles)window.mixtapeFiles={list:async d=>{const r=await fetch(M2.fileUrl(d+'/files.json'));if(!r.ok)throw new Error('no list: '+d);return r.json();},
  read:async p=>{const r=await fetch(M2.fileUrl(p.replace(/#/g,'s')));return r.ok?new Uint8Array(await r.arrayBuffer()):null;}};   /* (a sharp's # is an s there: a # cannot be in a web address) */
let tt=0;M2.ui={toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),3500);}};
})();
</script>
<script src="Devices/halo.js"></script>
<script src="Devices/driftwood.js"></script>
<script>
/* ---- DRIFTWOOD itself, scaled to fit the window, its sound to the computer's output ---- */
(()=>{const M2=window.M2,def=M2.defs.get('driftwood'),dev=document.getElementById('dev'),fit=document.getElementById('fit');
if(!def){dev.textContent='DRIFTWOOD did not load (mixtape2\\Devices\\driftwood.js)';return;}
const settings=Object.assign(JSON.parse(JSON.stringify(def.settings)),M2.store.get('settings')||{});
let saveT=0;const save=()=>{clearTimeout(saveT);saveT=setTimeout(()=>M2.store.set('settings',settings),300);};
const host={uid:'driftwood',def,el:dev,settings,engine:M2.engine,clock:M2.clock,files:window.mixtapeFiles,get visible(){return !document.hidden;},
  changed:save,send:()=>[],resized(){},toast:t=>M2.ui.toast(t),fileUrl:M2.fileUrl,tool(){}};
const inst=def.create(host);inst.node('out').connect(M2.engine.master);
const size=()=>{const k=Math.min((innerWidth-24)/760,(innerHeight-40)/400);fit.style.transform=`scale(${k}) translate(-50%,-50%)`;};size();addEventListener('resize',size);
addEventListener('beforeunload',()=>{M2.store.set('settings',settings);});
document.addEventListener('visibilitychange',()=>{if(inst.visible)inst.visible(!document.hidden);});
const ctx=M2.engine.ctx,start=document.getElementById('start');
const check=()=>{start.style.display=ctx.state==='running'?'none':'flex';};start.onclick=()=>ctx.resume().then(check);ctx.addEventListener('statechange',check);setTimeout(check,400);
window.DRIFTWOOD={inst};
})();
</script>
</body>
</html>
